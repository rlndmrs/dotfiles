# next/prev tab with shift left/right
bind -n S-Right next-window
bind -n S-Left previous-window

bind C-p last-window

# options
set -g mode-keys vi
set -g mouse on
set -s set-clipboard on
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -ag terminal-overrides ",*:RGB"
set -g focus-events on
setw -g aggressive-resize on

# status bar
set-option -g status-right ''
set-option -g status-style fg=blue,bg=white
set-window-option -g window-status-style fg=blue,bg=white
set-window-option -g window-status-format ' #W '
set-window-option -g window-status-current-style fg=white,bg=blue
set-window-option -g window-status-current-format ' #W '

# color of split line
set -g pane-border-style fg=white,bg=default
set -g pane-active-border-style fg=white,bg=default
