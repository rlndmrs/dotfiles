<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 316" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Keycap Drop Shadow -->
    <filter id="keyShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Standard Key Gradient -->
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Modifier Key Gradient -->
    <linearGradient id="modGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <style>
    .board-bg { fill: #1e293b; rx: 14px; }
    .key { fill: url(#keyGrad); stroke: #94a3b8; stroke-width: 1; rx: 6px; filter: url(#keyShadow); }
    .mod { fill: url(#modGrad); stroke: #94a3b8; stroke-width: 1; rx: 6px; filter: url(#keyShadow); }
    .t-main { font-size: 14px; font-weight: 600; fill: #0f172a; }
    .t-sub  { font-size: 13px; font-weight: 400; fill: #475569; }
    .t-alt  { font-size: 12px; font-weight: 600; fill: #0284c7; }
    .t-mod  { font-size: 12.5px; font-weight: 600; fill: #334155; }
  </style>

  <!-- Keyboard Chassis -->
  <rect x="2" y="2" width="920" height="312" class="board-bg"/>

  <!-- ================= ROW 1: Number Row (y=14) ================= -->
  <g transform="translate(14, 14)">
    <!-- # / @ -->
    <rect x="0" y="0" width="54" height="52" class="key"/>
    <text x="10" y="20" class="t-main">&#35;</text>
    <text x="10" y="42" class="t-sub">&#64;</text>

    <!-- 1 / & -->
    <rect x="60" y="0" width="54" height="52" class="key"/>
    <text x="70" y="20" class="t-main">1</text>
    <text x="70" y="42" class="t-sub">&#38;</text>

    <!-- 2 / ~ -->
    <rect x="120" y="0" width="54" height="52" class="key"/>
    <text x="130" y="20" class="t-main">2</text>
    <text x="130" y="42" class="t-sub">&#126;</text>

    <!-- 3 / " -->
    <rect x="180" y="0" width="54" height="52" class="key"/>
    <text x="190" y="20" class="t-main">3</text>
    <text x="190" y="42" class="t-sub">&#34;</text>

    <!-- 4 / ' -->
    <rect x="240" y="0" width="54" height="52" class="key"/>
    <text x="250" y="20" class="t-main">4</text>
    <text x="250" y="42" class="t-sub">&#39;</text>

    <!-- 5 / ( -->
    <rect x="300" y="0" width="54" height="52" class="key"/>
    <text x="310" y="20" class="t-main">5</text>
    <text x="310" y="42" class="t-sub">&#40;</text>

    <!-- 6 / [ -->
    <rect x="360" y="0" width="54" height="52" class="key"/>
    <text x="370" y="20" class="t-main">6</text>
    <text x="370" y="42" class="t-sub">&#91;</text>

    <!-- 7 / ] -->
    <rect x="420" y="0" width="54" height="52" class="key"/>
    <text x="430" y="20" class="t-main">7</text>
    <text x="430" y="42" class="t-sub">&#93;</text>

    <!-- 8 / ! -->
    <rect x="480" y="0" width="54" height="52" class="key"/>
    <text x="490" y="20" class="t-main">8</text>
    <text x="490" y="42" class="t-sub">&#33;</text>

    <!-- 9 / { -->
    <rect x="540" y="0" width="54" height="52" class="key"/>
    <text x="550" y="20" class="t-main">9</text>
    <text x="550" y="42" class="t-sub">&#123;</text>

    <!-- 0 / } -->
    <rect x="600" y="0" width="54" height="52" class="key"/>
    <text x="610" y="20" class="t-main">0</text>
    <text x="610" y="42" class="t-sub">&#125;</text>

    <!-- ° / ) -->
    <rect x="660" y="0" width="54" height="52" class="key"/>
    <text x="670" y="20" class="t-main">&#176;</text>
    <text x="670" y="42" class="t-sub">&#41;</text>

    <!-- _ / - -->
    <rect x="720" y="0" width="54" height="52" class="key"/>
    <text x="730" y="20" class="t-main">&#95;</text>
    <text x="730" y="42" class="t-sub">&#45;</text>

    <!-- Backspace (116px) -->
    <rect x="780" y="0" width="116" height="52" class="mod"/>
    <text x="792" y="22" class="t-mod">&#9003; Back</text>
  </g>

  <!-- ================= ROW 2: Top Alpha Row (y=72) ================= -->
  <g transform="translate(14, 72)">
    <!-- Tab (84px) -->
    <rect x="0" y="0" width="84" height="52" class="mod"/>
    <text x="10" y="40" class="t-mod">Tab &#8633;</text>

    <!-- A / a -->
    <rect x="90" y="0" width="54" height="52" class="key"/>
    <text x="100" y="20" class="t-main">A</text>
    <text x="100" y="42" class="t-sub">a</text>

    <!-- Z / z -->
    <rect x="150" y="0" width="54" height="52" class="key"/>
    <text x="160" y="20" class="t-main">Z</text>
    <text x="160" y="42" class="t-sub">z</text>

    <!-- E / e € -->
    <rect x="210" y="0" width="54" height="52" class="key"/>
    <text x="220" y="20" class="t-main">E</text>
    <text x="220" y="42" class="t-sub">e</text>
    <text x="242" y="42" class="t-alt">&#8364;</text>

    <!-- R / r -->
    <rect x="270" y="0" width="54" height="52" class="key"/>
    <text x="280" y="20" class="t-main">R</text>
    <text x="280" y="42" class="t-sub">r</text>

    <!-- T / t -->
    <rect x="330" y="0" width="54" height="52" class="key"/>
    <text x="340" y="20" class="t-main">T</text>
    <text x="340" y="42" class="t-sub">t</text>

    <!-- Y / y -->
    <rect x="390" y="0" width="54" height="52" class="key"/>
    <text x="400" y="20" class="t-main">Y</text>
    <text x="400" y="42" class="t-sub">y</text>

    <!-- U / u -->
    <rect x="450" y="0" width="54" height="52" class="key"/>
    <text x="460" y="20" class="t-main">U</text>
    <text x="460" y="42" class="t-sub">u</text>

    <!-- I / i -->
    <rect x="510" y="0" width="54" height="52" class="key"/>
    <text x="520" y="20" class="t-main">I</text>
    <text x="520" y="42" class="t-sub">i</text>

    <!-- O / o -->
    <rect x="570" y="0" width="54" height="52" class="key"/>
    <text x="580" y="20" class="t-main">O</text>
    <text x="580" y="42" class="t-sub">o</text>

    <!-- P / p -->
    <rect x="630" y="0" width="54" height="52" class="key"/>
    <text x="640" y="20" class="t-main">P</text>
    <text x="640" y="42" class="t-sub">p</text>

    <!-- ¨ / ^ -->
    <rect x="690" y="0" width="54" height="52" class="key"/>
    <text x="700" y="20" class="t-main">&#168;</text>
    <text x="700" y="42" class="t-sub">&#94;</text>

    <!-- * / $ -->
    <rect x="750" y="0" width="54" height="52" class="key"/>
    <text x="760" y="20" class="t-main">&#42;</text>
    <text x="760" y="42" class="t-sub">&#36;</text>
  </g>

  <!-- ================= ISO RETURN KEY (Spans Row 2 & Row 3) ================= -->
  <g transform="translate(824, 72)">
    <path d="M 6,0 H 80 A 6,6 0 0 1 86,6 V 104 A 6,6 0 0 1 80,110 H 20 A 6,6 0 0 1 14,104 V 58 A 6,6 0 0 0 8,52 H 6 A 6,6 0 0 1 0,46 V 6 A 6,6 0 0 1 6,0 Z" class="mod"/>
    <text x="24" y="22" class="t-mod">Return</text>
    <text x="48" y="44" class="t-mod" font-size="16">&#9166;</text>
  </g>

  <!-- ================= ROW 3: Home Row (y=130) ================= -->
  <g transform="translate(14, 130)">
    <!-- Caps Lock (98px) -->
    <rect x="0" y="0" width="98" height="52" class="mod"/>
    <text x="10" y="40" class="t-mod">Caps &#8684;</text>

    <!-- Q / q -->
    <rect x="104" y="0" width="54" height="52" class="key"/>
    <text x="114" y="20" class="t-main">Q</text>
    <text x="114" y="42" class="t-sub">q</text>

    <!-- S / s -->
    <rect x="164" y="0" width="54" height="52" class="key"/>
    <text x="174" y="20" class="t-main">S</text>
    <text x="174" y="42" class="t-sub">s</text>

    <!-- D / d -->
    <rect x="224" y="0" width="54" height="52" class="key"/>
    <text x="234" y="20" class="t-main">D</text>
    <text x="234" y="42" class="t-sub">d</text>

    <!-- F / f -->
    <rect x="284" y="0" width="54" height="52" class="key"/>
    <text x="294" y="20" class="t-main">F</text>
    <text x="294" y="42" class="t-sub">f</text>

    <!-- G / g -->
    <rect x="344" y="0" width="54" height="52" class="key"/>
    <text x="354" y="20" class="t-main">G</text>
    <text x="354" y="42" class="t-sub">g</text>

    <!-- H / h -->
    <rect x="404" y="0" width="54" height="52" class="key"/>
    <text x="414" y="20" class="t-main">H</text>
    <text x="414" y="42" class="t-sub">h</text>

    <!-- J / j -->
    <rect x="464" y="0" width="54" height="52" class="key"/>
    <text x="474" y="20" class="t-main">J</text>
    <text x="474" y="42" class="t-sub">j</text>

    <!-- K / k -->
    <rect x="524" y="0" width="54" height="52" class="key"/>
    <text x="534" y="20" class="t-main">K</text>
    <text x="534" y="42" class="t-sub">k</text>

    <!-- L / l -->
    <rect x="584" y="0" width="54" height="52" class="key"/>
    <text x="594" y="20" class="t-main">L</text>
    <text x="594" y="42" class="t-sub">l</text>

    <!-- M / m -->
    <rect x="644" y="0" width="54" height="52" class="key"/>
    <text x="654" y="20" class="t-main">M</text>
    <text x="654" y="42" class="t-sub">m</text>

    <!-- % / ` -->
    <rect x="704" y="0" width="54" height="52" class="key"/>
    <text x="714" y="20" class="t-main">&#37;</text>
    <text x="714" y="42" class="t-sub">&#96;</text>

    <!-- | / \ -->
    <rect x="764" y="0" width="54" height="52" class="key"/>
    <text x="774" y="20" class="t-main">&#124;</text>
    <text x="774" y="42" class="t-sub">&#92;</text>
  </g>

  <!-- ================= ROW 4: Bottom Alpha Row (y=188) ================= -->
  <g transform="translate(14, 188)">
    <!-- Left Shift (74px) -->
    <rect x="0" y="0" width="74" height="52" class="mod"/>
    <text x="10" y="40" class="t-mod">Shift &#8679;</text>

    <!-- > / < -->
    <rect x="80" y="0" width="54" height="52" class="key"/>
    <text x="90" y="20" class="t-main">&#62;</text>
    <text x="90" y="42" class="t-sub">&#60;</text>

    <!-- W / w -->
    <rect x="140" y="0" width="54" height="52" class="key"/>
    <text x="150" y="20" class="t-main">W</text>
    <text x="150" y="42" class="t-sub">w</text>

    <!-- X / x -->
    <rect x="200" y="0" width="54" height="52" class="key"/>
    <text x="210" y="20" class="t-main">X</text>
    <text x="210" y="42" class="t-sub">x</text>

    <!-- C / c -->
    <rect x="260" y="0" width="54" height="52" class="key"/>
    <text x="270" y="20" class="t-main">C</text>
    <text x="270" y="42" class="t-sub">c</text>

    <!-- V / v -->
    <rect x="320" y="0" width="54" height="52" class="key"/>
    <text x="330" y="20" class="t-main">V</text>
    <text x="330" y="42" class="t-sub">v</text>

    <!-- B / b -->
    <rect x="380" y="0" width="54" height="52" class="key"/>
    <text x="390" y="20" class="t-main">B</text>
    <text x="390" y="42" class="t-sub">b</text>

    <!-- N / n -->
    <rect x="440" y="0" width="54" height="52" class="key"/>
    <text x="450" y="20" class="t-main">N</text>
    <text x="450" y="42" class="t-sub">n</text>

    <!-- ? / , -->
    <rect x="500" y="0" width="54" height="52" class="key"/>
    <text x="510" y="20" class="t-main">&#63;</text>
    <text x="510" y="42" class="t-sub">&#44;</text>

    <!-- . / ; -->
    <rect x="560" y="0" width="54" height="52" class="key"/>
    <text x="570" y="20" class="t-main">&#46;</text>
    <text x="570" y="42" class="t-sub">&#59;</text>

    <!-- / / : -->
    <rect x="620" y="0" width="54" height="52" class="key"/>
    <text x="630" y="20" class="t-main">&#47;</text>
    <text x="630" y="42" class="t-sub">&#58;</text>

    <!-- + / = -->
    <rect x="680" y="0" width="54" height="52" class="key"/>
    <text x="690" y="20" class="t-main">&#43;</text>
    <text x="690" y="42" class="t-sub">&#61;</text>

    <!-- Right Shift (156px) -->
    <rect x="740" y="0" width="156" height="52" class="mod"/>
    <text x="752" y="40" class="t-mod">Shift &#8679;</text>
  </g>

  <!-- ================= ROW 5: Bottom Modifier Row (y=246) ================= -->
  <g transform="translate(14, 246)">
    <!-- Left Ctrl (74px) -->
    <rect x="0" y="0" width="74" height="52" class="mod"/>
    <text x="10" y="40" class="t-mod">Ctrl</text>

    <!-- Meta (74px) -->
    <rect x="80" y="0" width="74" height="52" class="mod"/>
    <text x="90" y="40" class="t-mod">Meta</text>

    <!-- Alt (74px) -->
    <rect x="160" y="0" width="74" height="52" class="mod"/>
    <text x="170" y="40" class="t-mod">Alt</text>

    <!-- Spacebar (414px) -->
    <rect x="240" y="0" width="414" height="52" class="key"/>
    <text x="256" y="40" class="t-sub">&#9251;</text>
    <text x="447" y="40" class="t-mod" text-anchor="middle">Space</text>
    <text x="638" y="40" class="t-sub" text-anchor="end">&#9251;</text>

    <!-- AltGr (78px) -->
    <rect x="660" y="0" width="78" height="52" class="mod"/>
    <text x="670" y="40" class="t-mod">AltGr &#8686;</text>

    <!-- Menu (74px) -->
    <rect x="744" y="0" width="74" height="52" class="mod"/>
    <text x="754" y="40" class="t-mod">Menu</text>

    <!-- Right Ctrl (72px) -->
    <rect x="824" y="0" width="72" height="52" class="mod"/>
    <text x="834" y="40" class="t-mod">Ctrl</text>
  </g>
</svg>
